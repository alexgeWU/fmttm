<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Fly Me to the Moon</title>
		<script src="coi-serviceworker.js"></script>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* ---------- Click-to-Start overlay ---------- */
#start-overlay {
	position: fixed;
	inset: 0;
	z-index: 9999;
	background: #000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	cursor: pointer;
	user-select: none;
	-webkit-user-select: none;
}

#start-overlay h1 {
	font-family: 'Georgia', 'Times New Roman', serif;
	font-size: clamp(1.6rem, 5vw, 3.2rem);
	color: #e8d5b5;
	letter-spacing: 0.12em;
	text-transform: uppercase;
	animation: pulse 2s ease-in-out infinite;
}

#start-overlay p {
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: clamp(0.8rem, 2vw, 1.1rem);
	color: #887766;
	margin-top: 1.2rem;
}

@keyframes pulse {
	0%, 100% { opacity: 0.6; }
	50%      { opacity: 1.0; }
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="Fly Me to the Moon.icon.png" />
		<link rel="apple-touch-icon" href="Fly Me to the Moon.apple-touch-icon.png"/>
	</head>
	<body>
		<!-- Click-to-Start gate -->
		<div id="start-overlay">
			<h1>Click to Start</h1>
			<p>Fly Me to the Moon</p>
		</div>

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="Fly Me to the Moon.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<!-- Load Godot engine normally so it's ready -->
		<script src="Fly Me to the Moon.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"Fly Me to the Moon","experimentalVK":false,"fileSizes":{"Fly Me to the Moon.pck":771088,"Fly Me to the Moon.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// --- AudioContext monkey-patch: auto-resume on creation after user gesture ---
(function () {
	const _OrigAC = window.AudioContext || window.webkitAudioContext;
	if (_OrigAC) {
		const _acList = [];
		window.AudioContext = function (...args) {
			const ctx = new _OrigAC(...args);
			_acList.push(ctx);
			if (ctx.state !== 'running') ctx.resume();
			return ctx;
		};
		window.AudioContext.prototype = _OrigAC.prototype;
		window.webkitAudioContext = window.AudioContext;

		// Also resume on any future interaction, just in case
		function resumeAll() {
			_acList.forEach(ctx => { if (ctx.state !== 'running') ctx.resume(); });
		}
		['click','touchstart','pointerdown','keydown'].forEach(e =>
			document.addEventListener(e, resumeAll, { capture: true })
		);
	}
})();

// --- Wait for click, then start the game ---
const overlay = document.getElementById('start-overlay');

function onUserStart() {
	overlay.removeEventListener('click', onUserStart);
	overlay.removeEventListener('touchend', onUserStart);

	overlay.querySelector('h1').textContent = 'Loading\u2026';
	overlay.querySelector('h1').style.animation = 'none';
	overlay.querySelector('h1').style.opacity = '1';
	overlay.querySelector('p').textContent = '';

	// Small delay so the browser registers the user gesture, then start Godot
	setTimeout(function () {
		overlay.style.display = 'none';
		startGodot();
	}, 500);
}

overlay.addEventListener('click', onUserStart);
overlay.addEventListener('touchend', onUserStart);

function startGodot() {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) setStatusNotice(err.message);
		else if (typeof err === 'string') setStatusNotice(err);
		else setStatusNotice('An unknown error occurred.');
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

	if (missing.length !== 0) {
		const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}
		</script>
	</body>
</html>
